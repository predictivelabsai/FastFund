services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5011:5011"
    environment:
      # Storage backend: 'neo4j' (default) or 'sqlite'.
      - DATA_STORAGE=${DATA_STORAGE:-neo4j}
      - DB_URL=sqlite:////app/data/taxhub.db
      # Neo4j: point at the bundled service below, or at AuraDB in production.
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - NEO4J_DATABASE=${NEO4J_DATABASE:-neo4j}
      - XAI_API_KEY=${XAI_API_KEY}
      - XAI_BASE_URL=${XAI_BASE_URL}
      - GROK_MODEL=${GROK_MODEL}
      - LLM_PROVIDER=${LLM_PROVIDER}
      - APP_SECRET=${APP_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - PORT=5011
    volumes:
      - taxhub-data:/app/data
    labels:
      - coolify.managed=true
      - coolify.port=5011
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5011/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # On-demand / scheduled scraper. Shares the same data volume as the web app.
  #   docker compose run --rm scrape --all
  scrape:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["tools"]
    environment:
      - DATA_STORAGE=${DATA_STORAGE:-neo4j}
      - DB_URL=sqlite:////app/data/taxhub.db
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - NEO4J_DATABASE=${NEO4J_DATABASE:-neo4j}
      - XAI_API_KEY=${XAI_API_KEY}
      - XAI_BASE_URL=${XAI_BASE_URL}
      - GROK_MODEL=${GROK_MODEL}
      - LLM_PROVIDER=${LLM_PROVIDER}
    volumes:
      - taxhub-data:/app/data
    entrypoint: ["python", "scrape_tax.py"]
    command: ["--all"]

  # Self-hosted Neo4j for environments not using AuraDB. Opt-in:
  #   docker compose --profile neo4j up -d
  # In production prefer AuraDB: set NEO4J_URI=neo4j+s://<id>.databases.neo4j.io
  # and drop this service.
  neo4j:
    image: neo4j:5.26-community
    profiles: ["neo4j"]
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD}
      - NEO4J_server_memory_heap_max__size=1G
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u $${NEO4J_USER:-neo4j} -p $${NEO4J_PASSWORD} 'RETURN 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  taxhub-data:
  neo4j-data:
