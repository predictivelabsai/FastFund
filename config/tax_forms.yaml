# Tax FORMS catalogue — the primary corpus (forms only; legislation is linked,
# not collected). Forms live on the revenue AUTHORITY sites, not legislation sites.
#
# Per jurisdiction:
#   forms_index    : authority page to discover form PDFs from (download mode)
#   index_browser  : true if the index needs a headed/browser fetch (UA/JS/CF gated)
#   forms[]        : curated entries — metadata + taxonomy + provenance
#       mode           : download (fetch the PDF) | portal (online-only; store link, no PDF)
#       source/url     : page to discover the PDF from, or a direct PDF/portal URL
#       match          : substring to pick the right PDF link on the index
#       legislation_ref: URL of the law the form implements (provenance, not downloaded)
#       category/form_type drive the Forms Tree taxonomy.
#
# Categories: corporate_tax | economic_substance | aeoi | beneficial_ownership
#             | partnership | personal_employer | gst_vat | fund
# Form types: return | notification | declaration | registration | report | guidance

jurisdictions:
  JE:
    name: Jersey
    authority: Revenue Jersey
    index_browser: true                      # gov.je is UA-gated
    forms_index: https://www.gov.je/TaxesMoney/IncomeTax/Companies/Pages/index.aspx
    index_category: corporate_tax
    index_form_type: form
    index_filing_type: online
    forms:
      - form_key: corporate_tax_return
        title: Company Tax Return (Jersey)
        category: corporate_tax
        form_type: return
        mode: portal                         # filed online via Revenue Jersey
        url: https://www.gov.je/TaxesMoney/IncomeTax/Companies/CompanyTaxGuidance/pages/corporatetaxreturnguidancenotesintroduction.aspx
        who_files: Companies tax-resident in Jersey or with a Jersey permanent establishment
        frequency: annual
        deadline: "30 November of the year following the year of assessment"
        legislation_ref: https://www.jerseylaw.je/laws/current/PDFs/L_29_1961.pdf
      - form_key: economic_substance
        title: Economic Substance — Company filing (Jersey)
        category: economic_substance
        form_type: return
        mode: portal                         # via the corporate return
        url: https://www.gov.je/TaxesMoney/IncomeTax/Companies/Guidelines/pages/economicsubstanceforcompanies.aspx
        who_files: Resident companies carrying on a relevant activity
        frequency: annual
        deadline: "With the company tax return"
        legislation_ref: https://www.jerseylaw.je/laws/current/PDFs/L_3_2019.pdf

  GG:
    name: Guernsey
    authority: Guernsey Revenue Service
    forms_index: https://www.gov.gg/revenue-service/income-tax-forms
    index_category: corporate_tax
    index_form_type: form
    index_filing_type: downloadable
    index_match: CHttpHandler          # gov.gg serves PDFs via CHttpHandler.ashx?id=N
    forms:
      - form_key: company_income_tax_return
        title: Company Income Tax Return (Guernsey)
        category: corporate_tax
        form_type: return
        mode: download
        source: https://www.gov.gg/revenue-service/income-tax-forms
        match: company
        who_files: Guernsey-resident companies (incorporates the economic substance declaration)
        frequency: annual
        deadline: "30 November of the year following the year of charge"
        legislation_ref: https://www.gov.gg/RevenueService/Companies

  LU:
    name: Luxembourg
    authority: Administration des contributions directes (ACD)
    forms_index: https://impotsdirects.public.lu/fr/formulaires/collectivites.html
    index_category: corporate_tax
    index_form_type: form
    index_filing_type: downloadable
    forms:
      - form_key: corporate_income_tax_return_500
        title: Déclaration pour l'impôt sur le revenu des collectivités (Form 500)
        category: corporate_tax
        form_type: return
        mode: download
        source: https://impotsdirects.public.lu/fr/formulaires/collectivites.html
        match: "500"
        who_files: Luxembourg resident companies (incl. SOPARFI)
        frequency: annual
        deadline: "31 December"
        legislation_ref: https://impotsdirects.public.lu/fr/az/i/impot_revenu_collectivites.html

  IE:
    name: Ireland
    authority: Revenue Commissioners
    forms_index: https://www.revenue.ie/en/companies-and-charities/corporation-tax-for-companies/corporation-tax/index.aspx
    index_category: corporate_tax
    index_form_type: form
    index_filing_type: reference
    forms:
      - form_key: form_ct1
        title: Corporation Tax Return — Form CT1 (Ireland)
        category: corporate_tax
        form_type: return
        mode: portal                         # filed via ROS
        url: https://www.revenue.ie/en/companies-and-charities/corporation-tax-for-companies/corporation-tax/index.aspx
        who_files: Irish resident companies and non-resident companies trading through a branch
        frequency: annual
        deadline: "23rd of the 9th month after the accounting period end"
        legislation_ref: https://www.irishstatutebook.ie/eli/1997/act/39/enacted/en/html

  KY:
    name: Cayman Islands
    authority: Department for International Tax Cooperation (DITC)
    forms_index: https://www.ditc.ky/economic-substance/es-documents/
    index_category: economic_substance
    index_form_type: form
    index_filing_type: reference
    forms:
      - form_key: economic_substance_notification_guide
        title: Economic Substance Notification — User Guide (Cayman)
        category: economic_substance
        form_type: guidance
        mode: download
        url: https://www.ditc.ky/wp-content/uploads/Economic-Substance-Notification-User-Guide.pdf
        who_files: All Cayman entities (ESN filed before the annual return)
        frequency: annual
        deadline: "With the annual return"
        legislation_ref: https://www.ditc.ky/economic-substance/
      - form_key: economic_substance_return
        title: Economic Substance Return (Cayman)
        category: economic_substance
        form_type: return
        mode: portal                         # filed on the DITC Portal
        url: https://www.ditc.ky/ditc-portal/
        who_files: Relevant entities carrying on a relevant activity
        frequency: annual
        deadline: "12 months after the end of the relevant financial year"
        legislation_ref: https://www.ditc.ky/economic-substance/

  VG:
    name: British Virgin Islands
    authority: BVI International Tax Authority (ITA)
    forms_index: https://bviita.vg/economic-substance
    index_category: economic_substance
    index_form_type: form
    index_filing_type: reference
    forms:
      - form_key: economic_substance_filing
        title: Economic Substance Filing (BVI, via BOSS)
        category: economic_substance
        form_type: report
        mode: portal                         # filed via the BOSS system
        url: https://bviita.vg/economic-substance
        who_files: BVI legal entities carrying on a relevant activity
        frequency: annual
        deadline: "Within 6 months of the end of the financial period"
        legislation_ref: https://bviita.vg/economic-substance
