# Tax FORMS catalogue — the primary corpus (forms only; legislation is linked,
# not collected). Forms live on the revenue AUTHORITY sites, not legislation sites.
#
# Per jurisdiction:
#   forms_index    : authority page to discover form PDFs from (download mode)
#   index_browser  : true if the index needs a headed/browser fetch (UA/JS/CF gated)
#   forms[]        : curated entries — metadata + taxonomy + provenance
#       mode           : download (fetch the PDF) | portal (online-only; store link, no PDF)
#       source/url     : page to discover the PDF from, or a direct PDF/portal URL
#       match          : substring to pick the right PDF link on the index
#       legislation_ref: URL of the law the form implements (provenance, not downloaded)
#       category/form_type drive the Forms Tree taxonomy.
#
# Categories: corporate_tax | economic_substance | aeoi | beneficial_ownership
#             | partnership | personal_employer | gst_vat | fund
# Form types: return | notification | declaration | registration | report | guidance

jurisdictions:
  JE:
    name: Jersey
    authority: Revenue Jersey
    index_browser: true                      # gov.je is UA-gated
    forms_index: https://www.gov.je/TaxesMoney/IncomeTax/Companies/Pages/index.aspx
    index_category: corporate_tax
    index_form_type: form
    index_filing_type: online
    forms:
      - form_key: corporate_tax_return
        title: Company Tax Return (Jersey)
        category: corporate_tax
        form_type: return
        mode: portal                         # filed online via Revenue Jersey
        url: https://www.gov.je/TaxesMoney/IncomeTax/Companies/CompanyTaxGuidance/pages/corporatetaxreturnguidancenotesintroduction.aspx
        who_files: Companies tax-resident in Jersey or with a Jersey permanent establishment
        frequency: annual
        deadline: "30 November of the year following the year of assessment"
        legislation_ref: https://www.jerseylaw.je/laws/current/PDFs/L_29_1961.pdf
      - form_key: economic_substance
        title: Economic Substance — Company filing (Jersey)
        category: economic_substance
        form_type: return
        mode: portal                         # via the corporate return
        url: https://www.gov.je/TaxesMoney/IncomeTax/Companies/Guidelines/pages/economicsubstanceforcompanies.aspx
        who_files: Resident companies carrying on a relevant activity
        frequency: annual
        deadline: "With the company tax return"
        legislation_ref: https://www.jerseylaw.je/laws/current/PDFs/L_3_2019.pdf

