# TaxHub — LEGISLATIVE SOURCES catalogue (the law / provenance corpus).
#
# ⚠ This file lists LEGISLATION, GUIDANCE, CIRCULARS, GAZETTES and TREATIES only —
#   the primary law that tax forms implement. Scraped into (:Document)->(:Version)
#   nodes; powers citation/change traceability and the law_agent graph-RAG. This is
#   the SECONDARY corpus.
#
#   TAX FORMS — the PRIMARY corpus the product is built around — live in a SEPARATE
#   file, config/tax_forms.yaml, stored as distinct (:Form) nodes. Forms link back
#   to the relevant law here via `legislation_ref` (the law is linked, not duplicated).
#
# Structure:
#   jurisdictions:
#     <CODE>:
#       name / region / authority
#       sources:
#         - name:        short source id (stored on each document)
#           delay:       seconds to wait between fetches (politeness)
#           documents:
#             - id:        stable slug (unique within jurisdiction)
#               title:     official title
#               doc_type:  legislation | guidance | gazette | treaty
#               reference: statutory citation (optional)
#               url:       exact document URL
#               format:    html | pdf
#               fetch:     http | browser
#               selector:  CSS selector to pin extraction (html only, optional)
#
# YAML merge anchors keep per-document records terse.

_anchors:
  jersey_law: &jersey_law
    doc_type: legislation
    format: pdf            # official consolidated PDF — bypasses jerseylaw.je JS/UA gating
    fetch: http
  pdf_http: &pdf_http
    format: pdf
    fetch: http
  html_http: &html_http
    format: html
    fetch: http
  browser_main: &browser_main        # JS/UA-gated gov sites (gov.je, gov.gg)
    format: html
    fetch: browser
    selector: "main"
    min_text: 800

